<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カルフ｜線で世界を重ねる人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F2;
    --ink:#2A2823;
    --ink-soft:#726E64;
    --hair:rgba(42,40,35,.14);
    --hair-strong:rgba(42,40,35,.30);
    --thread:rgba(42,40,35,.22);
    --light:#C39A3F;
    --light-glow:rgba(195,154,63,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14130F;
      --ink:#ECE9E1;
      --ink-soft:#9A968B;
      --hair:rgba(236,233,225,.14);
      --hair-strong:rgba(236,233,225,.28);
      --thread:rgba(236,233,225,.20);
      --light:#E6C170;
      --light-glow:rgba(230,193,112,.42);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14130F;
    --ink:#ECE9E1;
    --ink-soft:#9A968B;
    --hair:rgba(236,233,225,.14);
    --hair-strong:rgba(236,233,225,.28);
    --thread:rgba(236,233,225,.20);
    --light:#E6C170;
    --light-glow:rgba(230,193,112,.42);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }

  .page{
    position:relative;
    width:100%;
    max-width:460px;
    padding:0 28px 72px;
  }

  /* 一本の線 ── ページの真ん中を上から下へ通る */
  .page::before{
    content:"";
    position:absolute;
    top:0;bottom:0;
    left:50%;
    width:1px;
    background:var(--thread);
    transform:translateX(-.5px);
    z-index:0;
  }

  .inner{position:relative;z-index:1;}

  /* 光の点 ── 線のはじまり */
  .spark{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--light);
    margin:64px auto 0;
    box-shadow:0 0 0 5px var(--light-glow), 0 0 18px 3px var(--light-glow);
  }

  .head{
    text-align:center;
    padding:44px 0 52px;
  }
  .name{
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-weight:500;
    font-size:44px;
    letter-spacing:.14em;
    line-height:1.1;
    margin:0;
    /* 名前の背後を紙色でうすく抜き、線が名前に“重なる”余白をつくる */
    display:inline-block;
    padding:0 18px;
    background:var(--paper);
  }
  .name-en{
    font-family:"Shippori Mincho",serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:.42em;
    color:var(--ink-soft);
    margin:16px 0 0;
    padding-left:.42em;
  }
  .tagline{
    font-size:13.5px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    margin:22px 0 0;
    display:inline-block;
    padding:0 16px;
    background:var(--paper);
  }

  .links{
    list-style:none;
    margin:0;padding:0;
    border-top:1px solid var(--hair);
  }
  .links li{border-bottom:1px solid var(--hair);}

  .link{
    position:relative;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:12px;
    padding:22px 8px;
    text-decoration:none;
    color:var(--ink);
    background:var(--paper);
    transition:background .35s ease, color .35s ease, letter-spacing .35s ease;
  }
  .link .label{
    font-size:16px;
    letter-spacing:.10em;
    transition:letter-spacing .35s ease;
  }
  .link .sub{
    font-size:11.5px;
    letter-spacing:.16em;
    color:var(--ink-soft);
  }
  .link:hover .label,
  .link:focus-visible .label{ letter-spacing:.20em; }
  .link:hover{ color:var(--ink); }
  .link:focus-visible{
    outline:none;
    background:var(--light-glow);
  }

  /* 準備中の行 */
  .link.pending{ color:var(--ink-soft); cursor:default; }
  .link.pending .sub::after{ content:"　準備中"; }

  .foot{
    text-align:center;
    margin-top:40px;
  }
  .foot .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--thread);
    margin:0 auto 22px;
  }
  .foot p{
    font-family:"Shippori Mincho",serif;
    font-size:12px;
    letter-spacing:.24em;
    color:var(--ink-soft);
    margin:0;
    display:inline-block;
    padding:0 16px;
    background:var(--paper);
  }

  /* 登場は一度だけ、そっと */
  @media (prefers-reduced-motion: no-preference){
    .spark,.head,.links,.foot{
      opacity:0;
      transform:translateY(8px);
      animation:rise .9s ease forwards;
    }
    .head{animation-delay:.12s;}
    .links{animation-delay:.24s;}
    .foot{animation-delay:.36s;}
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }
</style>
</head>
<body>
  <main class="page">
    <div class="inner">
      <div class="spark" aria-hidden="true"></div>

      <header class="head">
        <h1 class="name">カルフ</h1>
        <p class="name-en">KARHU</p>
        <p class="tagline">線で世界を重ねる人</p>
      </header>

      <nav>
        <ul class="links">
          <li>
            <a class="link" href="https://www.instagram.com/karhu888" target="_blank" rel="noopener">
              <span class="label">Instagram</span>
              <span class="sub">作品</span>
            </a>
          </li>
          <li>
            <a class="link" href="https://www.instagram.com/karhu_photograph" target="_blank" rel="noopener">
              <span class="label">Instagram</span>
              <span class="sub">写真</span>
            </a>
          </li>
          <li>
            <a class="link" href="https://lin.ee/YyjmnCR" target="_blank" rel="noopener">
              <span class="label">公式LINE</span>
              <span class="sub">路地裏のアトリエ</span>
            </a>
          </li>
          <li>
            <a class="link" href="https://ipadgarden.fun/" target="_blank" rel="noopener">
              <span class="label">iPad Garden</span>
              <span class="sub">コミュニティ</span>
            </a>
          </li>
        </ul>
      </nav>

      <footer class="foot">
        <div class="dot" aria-hidden="true"></div>
      </footer>
    </div>
  </main>
  <script>
    // 準備中リンクは押しても飛ばない
    document.querySelectorAll('.link.pending').forEach(function(el){
      el.addEventListener('click', function(e){ e.preventDefault(); });
    });
  </script>
</body>
</html>
