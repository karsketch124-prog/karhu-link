<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カルフ｜線で世界を重ねる人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F2;
    --ink:#2A2823;
    --ink-soft:#726E64;
    --hair:rgba(42,40,35,.14);
    --hair-strong:rgba(42,40,35,.30);
    --thread:rgba(42,40,35,.22);
    --light:#C39A3F;
    --light-glow:rgba(195,154,63,.28);
    --ex:#C8603F;            /* 展示チラシのオレンジの線 */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14130F;
      --ink:#ECE9E1;
      --ink-soft:#9A968B;
      --hair:rgba(236,233,225,.14);
      --hair-strong:rgba(236,233,225,.28);
      --thread:rgba(236,233,225,.20);
      --light:#E6C170;
      --light-glow:rgba(230,193,112,.42);
      --ex:#E58A6A;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14130F;
    --ink:#ECE9E1;
    --ink-soft:#9A968B;
    --hair:rgba(236,233,225,.14);
    --hair-strong:rgba(236,233,225,.28);
    --thread:rgba(236,233,225,.20);
    --light:#E6C170;
    --light-glow:rgba(230,193,112,.42);
    --ex:#E58A6A;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }

  .page{
    position:relative;
    width:100%;
    max-width:460px;
    padding:0 28px 72px;
  }

  /* 一本の線 ── ページの真ん中を上から下へ通る */
  .page::before{
    content:"";
    position:absolute;
    top:0;bottom:0;
    left:50%;
    width:1px;
    background:var(--thread);
    transform:translateX(-.5px);
    z-index:0;
  }

  .inner{position:relative;z-index:1;}

  /* 光の点 ── 線のはじまり */
  .spark{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--light);
    margin:64px auto 0;
    box-shadow:0 0 0 5px var(--light-glow), 0 0 18px 3px var(--light-glow);
  }

  .head{
    text-align:center;
    padding:44px 0 40px;
  }
  .name{
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-weight:500;
    font-size:44px;
    letter-spacing:.14em;
    line-height:1.1;
    margin:0;
    display:inline-block;
    padding:0 18px;
    background:var(--paper);
  }
  .name-en{
    font-family:"Shippori Mincho",serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:.42em;
    color:var(--ink-soft);
    margin:16px 0 0;
    padding-left:.42em;
  }
  .tagline{
    font-size:13.5px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    margin:22px 0 0;
    display:inline-block;
    padding:0 16px;
    background:var(--paper);
  }

  /* 展示のお知らせ（期間限定） */
  .exhibit{
    position:relative;
    background:var(--paper);
    border:1px solid var(--hair-strong);
    text-align:center;
    padding:26px 18px 24px;
    margin:0 0 44px;
  }
  .ex-label{
    font-size:11px;
    letter-spacing:.32em;
    color:var(--ex);
    margin:0;
    padding-left:.32em;
  }
  .ex-kind{
    font-size:12.5px;
    letter-spacing:.16em;
    color:var(--ink-soft);
    margin:14px 0 0;
  }
  .ex-title{
    position:relative;
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-weight:500;
    font-size:24px;
    letter-spacing:.10em;
    line-height:1.4;
    margin:6px 0 0;
    display:inline-block;
    text-wrap:balance;
  }
  /* チラシと同じ、文字にかさなる一本の線 */
  .ex-title svg{
    position:absolute;
    left:-4%;
    width:108%;
    top:52%;
    height:18px;
    overflow:visible;
    pointer-events:none;
  }
  .ex-title path{fill:none;stroke:var(--ex);stroke-width:1.4;stroke-linecap:round;opacity:.85;}
  .ex-en{
    font-family:"Shippori Mincho",serif;
    font-size:11.5px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    margin:8px 0 0;
  }
  .ex-date{
    font-size:19px;
    letter-spacing:.06em;
    margin:20px 0 0;
    font-variant-numeric:tabular-nums;
  }
  .ex-date small{font-size:13px;color:var(--ink-soft);margin:0 1px;}
  .ex-time{
    font-size:12.5px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin:4px 0 0;
    font-variant-numeric:tabular-nums;
  }
  .ex-place{
    font-size:15px;
    letter-spacing:.06em;
    margin:16px 0 0;
  }
  .ex-access{
    font-size:12px;
    line-height:1.8;
    color:var(--ink-soft);
    margin:4px 0 0;
  }

  .links{
    list-style:none;
    margin:0;padding:0;
    border-top:1px solid var(--hair);
  }
  .links li{border-bottom:1px solid var(--hair);}

  .link{
    position:relative;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:12px;
    padding:22px 8px;
    text-decoration:none;
    color:var(--ink);
    background:var(--paper);
    transition:background .35s ease, color .35s ease, letter-spacing .35s ease;
  }
  .link .label{
    font-size:16px;
    letter-spacing:.10em;
    transition:letter-spacing .35s ease;
  }
  .link .sub{
    font-size:11.5px;
    letter-spacing:.16em;
    color:var(--ink-soft);
  }
  .link:hover .label,
  .link:focus-visible .label{ letter-spacing:.20em; }
  .link:hover{ color:var(--ink); }
  .link:focus-visible{
    outline:none;
    background:var(--light-glow);
  }

  .link.pending{ color:var(--ink-soft); cursor:default; }
  .link.pending .sub::after{ content:"　準備中"; }

  .foot{
    text-align:center;
    margin-top:40px;
  }
  .foot .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--thread);
    margin:0 auto 22px;
  }

  @media (max-width:380px){
    .page{padding-left:18px;padding-right:18px;}
    .ex-title{font-size:21px;}
  }

  @media (prefers-reduced-motion: no-preference){
    .spark,.head,.exhibit,.links,.foot{
      animation:rise .9s ease both;
    }
    .head{animation-delay:.12s;}
    .exhibit{animation-delay:.2s;}
    .links{animation-delay:.28s;}
    .foot{animation-delay:.36s;}
  }
  @keyframes rise{ from{ opacity:.0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
</style>
</head>
<body>
  <main class="page">
    <div class="inner">
      <div class="spark" aria-hidden="true"></div>

      <header class="head">
        <h1 class="name">カルフ</h1>
        <p class="name-en">KARHU</p>
        <p class="tagline">線で世界を重ねる人</p>
      </header>

      <!-- ▼ 展示のお知らせ（展示が終わったら、この section ごと消せばOK） -->
      <section class="exhibit" aria-label="親子作品展のお知らせ">
        <p class="ex-label">EXHIBITION</p>
        <p class="ex-kind">カルフとむすこ　親子作品展</p>
        <h2 class="ex-title">同じ景色、違う世界。<svg viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true"><path d="M2 14 C 22 2, 40 18, 58 9 S 88 1, 98 6"/></svg></h2>
        <p class="ex-en">Two Views, One World.</p>
        <p class="ex-date">2026.11.24<small>（火）</small>・27<small>（金）</small></p>
        <p class="ex-time">11:00〜15:00</p>
        <p class="ex-place">TAGLY base in 綱島</p>
        <p class="ex-access">東急東横線 綱島駅西口から徒歩1分<br>ご来店の際は、ワンドリンクオーダーをお願いします</p>
      </section>
      <!-- ▲ 展示のお知らせ ここまで -->

      <nav>
        <ul class="links">
          <li>
            <a class="link" href="https://www.instagram.com/karhu_mandala" target="_blank" rel="noopener">
              <span class="label">Instagram</span>
              <span class="sub">曼荼羅</span>
            </a>
          </li>
          <li>
            <a class="link" href="https://www.instagram.com/karhu888" target="_blank" rel="noopener">
              <span class="label">Instagram</span>
              <span class="sub">自由帳</span>
            </a>
          </li>
          <li>
            <a class="link" href="https://www.instagram.com/karhu_photograph" target="_blank" rel="noopener">
              <span class="label">Instagram</span>
              <span class="sub">写真</span>
            </a>
          </li>
          <li>
            <a class="link" href="https://lin.ee/YyjmnCR" target="_blank" rel="noopener">
              <span class="label">公式LINE</span>
              <span class="sub">路地裏のアトリエ</span>
            </a>
          </li>
          <li>
            <a class="link" href="https://ipadgarden.fun/" target="_blank" rel="noopener">
              <span class="label">iPad Garden</span>
              <span class="sub">コミュニティ</span>
            </a>
          </li>
        </ul>
      </nav>

      <footer class="foot">
        <div class="dot" aria-hidden="true"></div>
      </footer>
    </div>
  </main>
</body>
</html>
